{% extends "base.html" %}
{% block title %}{{ 'Kart Düzenle' if item else 'Yeni Kart' }}{% endblock %}
{% block content %}
<h1>{{ 'Stok Kartı Düzenle' if item else 'Yeni Stok Kartı' }}</h1>

<form method="post" class="form-grid">
  <label>Kod *
    <input type="text" name="code" value="{{ item.code if item else '' }}" required
           placeholder="örn. KCE-001">
  </label>
  <label>Ad *
    <input type="text" name="name" value="{{ item.name if item else '' }}" required
           placeholder="örn. 1. Pres Keçesi 850 gsm">
  </label>
  <label>Kategori
    <select name="category">
      {% for c in categories %}
      <option value="{{ c }}" {{ 'selected' if item and item.category == c }}>{{ c }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Tedarikçi
    <input type="text" name="supplier" value="{{ item.supplier if item else '' }}">
  </label>
  <label>En (mm)
    <input type="number" step="1" name="width_mm" value="{{ item.width_mm|int if item and item.width_mm else '' }}">
  </label>
  <label>Boy (mm)
    <input type="number" step="1" name="length_mm" value="{{ item.length_mm|int if item and item.length_mm else '' }}">
  </label>
  <label>Gramaj (g/m²)
    <input type="number" step="1" name="gsm" value="{{ item.gsm|int if item and item.gsm else '' }}">
  </label>
  <label>Birim Maliyet (₺)
    <input type="number" step="0.01" name="unit_cost" value="{{ item.unit_cost if item else 0 }}" required>
  </label>
  <label>Beklenen Ömür (gün)
    <input type="number" min="1" name="expected_life_days" value="{{ item.expected_life_days if item else 60 }}" required>
  </label>
  <label>Minimum Stok
    <input type="number" min="0" name="min_stock" value="{{ item.min_stock if item else 1 }}" required>
  </label>
  <label class="wide">Notlar
    <textarea name="notes" rows="3">{{ item.notes if item else '' }}</textarea>
  </label>
  <div class="wide">
    <button type="submit" class="btn primary">Kaydet</button>
    <a href="{{ url_for('stok') }}" class="btn">Vazgeç</a>
  </div>
</form>
{% endblock %}
